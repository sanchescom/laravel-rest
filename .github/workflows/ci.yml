name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: >
          composer require --no-interaction --no-update
          "illuminate/support:${{ matrix.laravel }}"
          "illuminate/container:${{ matrix.laravel }}"
          "illuminate/pagination:${{ matrix.laravel }}"
      - run: composer require --dev --no-interaction --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer lint
      - run: composer analyse
      - run: composer test
